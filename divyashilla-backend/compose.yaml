services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: divyashilla
      POSTGRES_DB: divyashilla
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run env:init first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divyashilla -d divyashilla"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
